<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>انضم إلينا | حركة إيرس الوطنية</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family:'Cairo',sans-serif; background:#090611; color:#f8fafc; margin:0; padding:32px 20px; }
    .box { max-width:680px; margin:0 auto; background:#160f29; border:1px solid rgba(167,139,250,0.22); border-radius:20px; padding:32px; }
    a { color:#c4b5fd; text-decoration:none; font-weight:700; }
    label { display:block; margin:14px 0 6px; font-weight:700; font-size:14px; }
    input, select, textarea {
      width:100%; padding:12px 14px; border-radius:10px;
      border:1px solid rgba(167,139,250,0.22); background:#0c0818;
      color:#fff; font-family:'Cairo',sans-serif; font-size:14px;
    }
    button {
      margin-top:20px; background:linear-gradient(135deg,#7c3aed,#6d28d9);
      color:#fff; border:none; padding:12px 24px; border-radius:12px;
      font-family:'Cairo',sans-serif; font-weight:700; font-size:15px; cursor:pointer;
    }
    .msg { display:none; margin-top:16px; padding:14px; border-radius:12px; background:rgba(124,58,237,0.22); color:#ede9fe; }
  </style>
</head>
<body>
  <div class="box">
    <a href="index.html">→ العودة إلى الرئيسية</a>
    <h1 style="margin-top:16px;">انضم إلى حركة إيرس الوطنية</h1>
    <p style="color:#cbd5e1; margin-top:6px;">لنصنع معاً مستقبلاً يليق بالعراق وكن جزءاً من التغيير.</p>

    <form id="joinForm">
      <label>الاسم الكامل</label>
      <input type="text" required placeholder="اكتب اسمك الثلاثي" />

      <label>المحافظة</label>
      <select required>
        <option value="">اختر المحافظة</option>
        <option>بغداد</option>
        <option>البصرة</option>
        <option>النجف الأشرف</option>
        <option>كربلاء المقدسة</option>
        <option>أربيل</option>
        <option>نينوى</option>
        <option>باقي المحافظات</option>
      </select>

      <label>المجال أو الهدف الأقرب لاهتمامك</label>
      <select>
        <option>الشباب والمرأة وتنمية قدراتهم</option>
        <option>الاقتصاد والتنمية المستدامة</option>
        <option>التعليم والثقافة وبناء الإنسان</option>
        <option>العدالة الاجتماعية والمواطنة</option>
        <option>البيئة ومستقبلها</option>
        <option>بناء الدولة وتعزيز السيادة</option>
      </select>

      <label>رسالتك أو مشاركتك</label>
      <textarea rows="4" placeholder="اكتب رسالتك أو كيف تحب أن تساهم..."></textarea>

      <button type="submit">إرسال طلب الانضمام ←</button>
      <div class="msg" id="joinMsg">تم استلام طلبك بنجاح! شكراً لاهتمامك بالانضمام إلى حركة إيرس الوطنية.</div>
    </form>
  </div>

  <script>
    document.getElementById('joinForm').addEventListener('submit', function(e) {
      e.preventDefault();
      document.getElementById('joinMsg').style.display = 'block';
      this.reset();
    });
  </script>
</body>
</html>
